      - /health/ready
      - /health/live
      
  - name: docs-route
    service: api
    strip_path: false
    paths:
      - /docs
      - /openapi.json
      - /api/v1/openapi.json
      
  - name: websocket-route
    service: api
    strip_path: false
    paths:
      - /ws
    protocols:
      - http
      - https

plugins:
  - name: correlation-id
    config:
      generator: uuid
      header_name: X-Request-ID
  - name: request-size-limiting
    config:
      allowed_payload_size: 50
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:3002
        - http://127.0.0.1:3000
        - http://127.0.0.1:3001
        - http://127.0.0.1:3002
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Request-ID
        - X-Idempotency-Key
        - Idempotency-Key
        - X-Portal-Id
        - Accept
        - Origin
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
