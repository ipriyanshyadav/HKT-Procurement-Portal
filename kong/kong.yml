_format_version: "3.0"

services:
  - name: api
    url: http://host.docker.internal:8080

routes:
  - name: auth-route
    service: api
    strip_path: false
    paths:
      - /api/v1/auth
    plugins:
      - name: rate-limiting
        config:
          minute: 1000

  
  - name: orgs-users-route
    service: api
    strip_path: false
    paths:
      - /api/v1/organizations
      - /api/v1/users
      - /api/v1/business-units
      - /api/v1/cost-centers
    plugins:
      - name: rate-limiting
        config:
          minute: 100
  
  - name: master-data-route
    service: api
    strip_path: false
    paths:
      - /api/v1/master-data
    plugins:
      - name: rate-limiting
        config:
          minute: 100
  
  - name: vendors-route
