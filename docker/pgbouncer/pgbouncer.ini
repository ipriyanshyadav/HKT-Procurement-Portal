[databases]
procurement = host=postgres port=5432 dbname=procurement

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
default_pool_size = 50
max_client_conn = 200
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
idle_transaction_timeout = 30
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
stats_period = 60
