version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: procurement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-procurement}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: procurement_redis
    ports:
      - "6379:6379"
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: procurement_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/procurement}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    container_name: procurement_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: procurement_jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - procurement_net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: procurement_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - procurement_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: procurement_grafana
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - procurement_net

  kong:
    image: kong:3.7
    container_name: procurement_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ../kong/kong.yml:/etc/kong/kong.yml
    networks:
      - procurement_net
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_api
    env_file:
      - ../.env
    ports:
      - "8080:8000"
    networks:
      - procurement_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_celery_worker
    command: celery -A app.tasks.celery_app worker
    env_file:
      - ../.env
    networks:
      - procurement_net
    depends_on:
      - api

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_celery_beat
    command: celery -A app.tasks.celery_app beat
    env_file:
      - ../.env
    networks:
      - procurement_net
    depends_on:
      - api

  buyer-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/buyer-portal/Dockerfile
    container_name: procurement_buyer_portal
    ports:
      - "3000:3000"
    networks:
      - procurement_net
    depends_on:
      - api

  supplier-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/supplier-portal/Dockerfile
    container_name: procurement_supplier_portal
    ports:
      - "3001:3001"
    networks:
      - procurement_net
    depends_on:
      - api

  admin-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/admin-portal/Dockerfile
    container_name: procurement_admin_portal
    ports:
      - "3002:3002"
    networks:
      - procurement_net
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  procurement_net:
    driver: bridge
