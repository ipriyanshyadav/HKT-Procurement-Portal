name: procurement-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: procurement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-procurement}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    container_name: procurement_pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-procurement}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MAX_CLIENT_CONN: 200
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 100
      AUTH_TYPE: any
      ADMIN_USERS: postgres
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks:
      - procurement_net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: procurement_redis
    ports:
      - "6379:6379"
    networks:
      - procurement_net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    container_name: procurement_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-${RABBITMQ_PASS:-guest}}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/procurement}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    restart: unless-stopped
    container_name: procurement_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4-debian
    restart: unless-stopped
    container_name: procurement_clamav
    ports:
      - "3310:3310"
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    container_name: procurement_jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - procurement_net

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    container_name: procurement_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - procurement_net

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    container_name: procurement_grafana
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - procurement_net

  kong:
    image: kong:3.7
    restart: unless-stopped
    container_name: procurement_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ${KONG_CONFIG_PATH:-../kong/kong.yml}:/etc/kong/kong.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - procurement_net

  elasticsearch:
    image: elasticsearch:8.14.0
    restart: unless-stopped
    container_name: procurement_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-${RABBITMQ_PASS:-guest}}@rabbitmq:5672/%2Fprocurement
      MINIO_ENDPOINT: minio:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      JAEGER_HOST: jaeger
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8080:8000"
    volumes:
      - ../keys:/app/keys
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -l info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      DATABASE_POOL_CLASS: "NullPool"
      IS_CELERY_WORKER: "true"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-${RABBITMQ_PASS:-guest}}@rabbitmq:5672/%2Fprocurement
      MINIO_ENDPOINT: minio:9000
      JAEGER_HOST: jaeger
    volumes:
      - ../keys:/app/keys
    networks:
      - procurement_net
    depends_on:
      api:
        condition: service_healthy

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: procurement_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat -l info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-procurement}
      DATABASE_POOL_CLASS: "NullPool"
      IS_CELERY_WORKER: "true"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-${RABBITMQ_PASS:-guest}}@rabbitmq:5672/%2Fprocurement
      MINIO_ENDPOINT: minio:9000
      JAEGER_HOST: jaeger
    volumes:
      - ../keys:/app/keys
    networks:
      - procurement_net
    depends_on:
      api:
        condition: service_healthy

  buyer-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/buyer-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_buyer_portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
      NODE_ENV: production
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  supplier-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/supplier-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_supplier_portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: "3001"
      NODE_ENV: production
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  admin-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/admin-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_admin_portal
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: "3002"
      NODE_ENV: production
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  procurement_net:
    driver: bridge
