name: procurement-portal

# ──────────────────────────────────────────────────────────────────────────────
# Common environment snippet reused across all API consumers
# ──────────────────────────────────────────────────────────────────────────────
x-api-env: &api-env
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-procurement}"
  ANALYTICS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-procurement}"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/%2Fprocurement"
  MINIO_ENDPOINT: "minio:9000"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  JAEGER_HOST: "jaeger"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  CELERY_BROKER_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/%2Fprocurement"
  CELERY_RESULT_BACKEND: "redis://redis:6379/3"
  OTEL_ENABLED: "${OTEL_ENABLED:-true}"

x-api-volumes: &api-volumes
  - ../keys:/app/keys:ro

services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — primary database
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: procurement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-procurement}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g

  # ──────────────────────────────────────────────────────────────────────────
  # PgBouncer — connection pooler (transaction mode)
  # ──────────────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    container_name: procurement_pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-procurement}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MAX_CLIENT_CONN: 500
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 100
      AUTH_TYPE: trust
      ADMIN_USERS: postgres
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - procurement_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-postgres} || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Redis 7 — sessions, rate-limits, cache, Celery results
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: procurement_redis
    ports:
      - "6379:6379"
    networks:
      - procurement_net
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 600m

  # ──────────────────────────────────────────────────────────────────────────
  # RabbitMQ 3.13 — event bus & Celery broker
  # ──────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    container_name: procurement_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/procurement}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # MinIO — object storage (documents, attachments)
  # ──────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    restart: unless-stopped
    container_name: procurement_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # ClamAV — antivirus scanning (opt-in by default disabled in dev)
  # ──────────────────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4-debian
    restart: unless-stopped
    container_name: procurement_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # ──────────────────────────────────────────────────────────────────────────
  # Jaeger — distributed tracing (all-in-one)
  # ──────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    container_name: procurement_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "6831:6831/udp"
      - "16686:16686" # Jaeger UI
    volumes:
      - jaeger_data:/data
    networks:
      - procurement_net
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # Prometheus — metrics scraping
  # ──────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    container_name: procurement_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - procurement_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # Grafana — dashboards
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    container_name: procurement_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - procurement_net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # ──────────────────────────────────────────────────────────────────────────
  # Elasticsearch 8 — audit log search & ticket full-text search
  # ──────────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.14.0
    restart: unless-stopped
    container_name: procurement_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
      cluster.routing.allocation.disk.watermark.low: "90%"
      cluster.routing.allocation.disk.watermark.high: "95%"
      cluster.routing.allocation.disk.watermark.flood_stage: "97%"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5g

  # ──────────────────────────────────────────────────────────────────────────
  # Kong 3.7 — API Gateway (declarative, DB-less)
  # ──────────────────────────────────────────────────────────────────────────
  kong:
    image: kong:3.7
    restart: unless-stopped
    container_name: procurement_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_NGINX_WORKER_PROCESSES: "2"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ${KONG_CONFIG_PATH:-../kong/kong.yml}:/etc/kong/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - procurement_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

  # ──────────────────────────────────────────────────────────────────────────
  # FastAPI — main backend API
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: procurement_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *api-env
    ports:
      - "8080:8000"
    volumes: *api-volumes
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  # ──────────────────────────────────────────────────────────────────────────
  # Celery Worker — background task processing
  # ──────────────────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: procurement_celery_worker
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker
        --loglevel=info
        --concurrency=4
        --prefetch-multiplier=1
        --max-tasks-per-child=200
    env_file:
      - ../.env
    environment:
      <<: *api-env
      DATABASE_POOL_CLASS: "NullPool"
      IS_CELERY_WORKER: "true"
    volumes: *api-volumes
    networks:
      - procurement_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ──────────────────────────────────────────────────────────────────────────
  # Celery Beat — periodic task scheduler (single instance only)
  # ──────────────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: procurement_celery_beat
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app beat
        --loglevel=info
        --scheduler celery.beat:PersistentScheduler
        --schedule /tmp/celerybeat-schedule
    env_file:
      - ../.env
    environment:
      <<: *api-env
      DATABASE_POOL_CLASS: "NullPool"
      IS_CELERY_WORKER: "true"
    volumes: *api-volumes
    networks:
      - procurement_net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # ──────────────────────────────────────────────────────────────────────────
  # Buyer Portal (Next.js) — port 3000
  # ──────────────────────────────────────────────────────────────────────────
  buyer-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/buyer-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_buyer_portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
      NODE_ENV: production
      PORT: "3000"
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # Supplier Portal (Next.js) — port 3001
  # ──────────────────────────────────────────────────────────────────────────
  supplier-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/supplier-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_supplier_portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: "3001"
      NODE_ENV: production
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # ──────────────────────────────────────────────────────────────────────────
  # Admin Portal (Next.js) — port 3002
  # ──────────────────────────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ../procurement-portal-frontend
      dockerfile: apps/admin-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: procurement_admin_portal
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: "3002"
      NODE_ENV: production
    networks:
      - procurement_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

# ──────────────────────────────────────────────────────────────────────────────
# Named volumes — persistent data survives container restarts
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  clamav_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  jaeger_data:

# ──────────────────────────────────────────────────────────────────────────────
# Network — isolated bridge network for all services
# ──────────────────────────────────────────────────────────────────────────────
networks:
  procurement_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
