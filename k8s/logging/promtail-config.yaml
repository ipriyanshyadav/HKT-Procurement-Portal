apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: logging
  labels:
    app: promtail
    app.kubernetes.io/part-of: procurement-portal
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: procurement-api
        static_configs:
          - targets: [localhost]
            labels:
              job: procurement-api
              __path__: /var/log/pods/procurement_procurement-api*/*/*.log
        pipeline_stages:
          - json:
              expressions:
                output: log
                level: level
                trace_id: trace_id
                user_id: user_id
                org_id: org_id
                request_id: request_id
          - drop:
              expression: '.*"/health".*'
          - drop:
              expression: '.*"/health/live".*'
          - drop:
              expression: '.*"/health/ready".*'
          - output:
              source: output
          - labels:
              level:
              trace_id:
              org_id:
