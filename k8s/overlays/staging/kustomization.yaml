apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/ingress.yaml

images:
  - name: procurement-api
    newName: procurement-api
    newTag: staging
  - name: procurement-buyer-portal
    newName: procurement-buyer-portal
    newTag: staging
  - name: procurement-supplier-portal
    newName: procurement-supplier-portal
    newTag: staging
  - name: procurement-admin-portal
    newName: procurement-admin-portal
    newTag: staging

configMapGenerator:
  - name: procurement-config
    namespace: procurement
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - NEXT_PUBLIC_API_URL=https://api-staging.procurement.com
      - NEXT_PUBLIC_WS_URL=wss://api-staging.procurement.com
