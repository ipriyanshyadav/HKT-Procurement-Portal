apiVersion: v1
kind: Service
metadata:
  name: procurement-api
  namespace: procurement
  labels:
    app: procurement-api
    app.kubernetes.io/name: procurement-api
    app.kubernetes.io/part-of: procurement-portal
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: procurement-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-api
  namespace: procurement
  labels:
    app: procurement-api
    app.kubernetes.io/name: procurement-api
    app.kubernetes.io/part-of: procurement-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: procurement-api
  template:
    metadata:
      labels:
        app: procurement-api
        app.kubernetes.io/name: procurement-api
        app.kubernetes.io/part-of: procurement-portal
    spec:
      containers:
        - name: api
          image: procurement-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          envFrom:
            - secretRef:
                name: procurement-secrets
            - configMapRef:
                name: procurement-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 30
