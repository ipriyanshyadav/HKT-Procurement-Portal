apiVersion: v1
kind: Secret
metadata:
  name: procurement-secrets
  namespace: procurement
  labels:
    app.kubernetes.io/name: procurement-secrets
    app.kubernetes.io/part-of: procurement-portal
type: Opaque
stringData:
  JWT_SECRET_KEY: "dev-jwt-secret-key-change-in-production-min-32-chars"
  JWT_PUBLIC_KEY: "dev-mock-public-key"
  JWT_PRIVATE_KEY: "dev-mock-private-key"
  SESSION_SECRET: "dev-session-secret-change-in-production"
  ENCRYPTION_KEY: "dev-encryption-key-must-be-32-bytes!"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: procurement
  labels:
    app.kubernetes.io/name: postgresql-secrets
    app.kubernetes.io/part-of: procurement-portal
type: Opaque
stringData:
  postgres-user: "app_user"
  postgres-password: "dev_password"
  replication-password: "dev_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: procurement
  labels:
    app.kubernetes.io/name: redis-secrets
    app.kubernetes.io/part-of: procurement-portal
type: Opaque
stringData:
  redis-password: "dev_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: procurement
  labels:
    app.kubernetes.io/name: rabbitmq-secrets
    app.kubernetes.io/part-of: procurement-portal
type: Opaque
stringData:
  erlang-cookie: "procurement-erlang-cookie-secret"
  rabbitmq-user: "app_user"
  rabbitmq-password: "dev_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: procurement
  labels:
    app.kubernetes.io/name: minio-secrets
    app.kubernetes.io/part-of: procurement-portal
type: Opaque
stringData:
  root-user: "minioadmin"
  root-password: "minioadmin"
