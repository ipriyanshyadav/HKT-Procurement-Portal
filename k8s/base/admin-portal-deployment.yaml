apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: procurement
  labels:
    app: admin-portal
    app.kubernetes.io/name: admin-portal
    app.kubernetes.io/part-of: procurement-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admin-portal
  template:
    metadata:
      labels:
        app: admin-portal
        app.kubernetes.io/name: admin-portal
        app.kubernetes.io/part-of: procurement-portal
    spec:
      containers:
        - name: admin-portal
          image: procurement-admin-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://procurement-api:8000"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.procurement.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.procurement.com"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
