apiVersion: v1
kind: ConfigMap
metadata:
  name: procurement-config
  namespace: procurement
  labels:
    app.kubernetes.io/name: procurement-config
    app.kubernetes.io/part-of: procurement-portal
data:
  ENVIRONMENT: "production"
  APP_VERSION: "1.0.0"
  DATABASE_URL: "postgresql+asyncpg://app_user:dev_password@pgbouncer:6432/procurement"
  ANALYTICS_DATABASE_URL: "postgresql+asyncpg://app_user:dev_password@postgresql-read:5432/procurement"
  REDIS_URL: "redis://redis-master:6379/0"
  RABBITMQ_URL: "amqp://app_user:dev_password@rabbitmq:5672/%2Fprocurement"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET_NAME: "procurement-docs"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.monitoring.svc.cluster.local:4317"
  LOG_LEVEL: "INFO"
  PORT: "8000"
