apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-ilm-policy
  namespace: procurement
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch-ilm
    app.kubernetes.io/part-of: procurement-portal
data:
  ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "rollover": {
                "max_primary_shard_size": "50GB",
                "max_age": "30d"
              },
              "set_priority": {
                "priority": 100
              }
            }
          },
          "warm": {
            "min_age": "30d",
            "actions": {
              "forcemerge": {
                "max_num_segments": 1
              },
              "set_priority": {
                "priority": 50
              }
            }
          },
          "cold": {
            "min_age": "90d",
            "actions": {
              "read_only": {},
              "set_priority": {
                "priority": 0
              }
            }
          },
          "delete": {
            "min_age": "365d",
            "actions": {
              "delete": {
                "delete_searchable_snapshot": true
              }
            }
          }
        }
      }
    }
  index-template.json: |
    {
      "index_patterns": ["audit-logs-*"],
      "template": {
        "settings": {
          "number_of_shards": 3,
          "number_of_replicas": 1,
          "index.lifecycle.name": "audit-logs-ilm-policy",
          "index.lifecycle.rollover_alias": "audit-logs"
        },
        "mappings": {
          "properties": {
            "id": { "type": "keyword" },
            "org_id": { "type": "keyword" },
            "entity_type": { "type": "keyword" },
            "entity_id": { "type": "keyword" },
            "action": { "type": "keyword" },
            "actor_id": { "type": "keyword" },
            "actor_email": { "type": "keyword" },
            "actor_ip": { "type": "ip" },
            "created_at": { "type": "date" },
            "trace_id": { "type": "keyword" },
            "field_changes": { "type": "object", "dynamic": true },
            "metadata": { "type": "object", "dynamic": true }
          }
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-ilm-setup
  namespace: procurement
  labels:
    app: elasticsearch-ilm-setup
    app.kubernetes.io/part-of: procurement-portal
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: elasticsearch-ilm-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup-ilm
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Elasticsearch..."
              until curl -s http://elasticsearch:9200/_cluster/health | grep -E '"status":"(green|yellow)"'; do
                sleep 3
              done
              echo "Applying ILM policy..."
              curl -X PUT "http://elasticsearch:9200/_ilm/policy/audit-logs-ilm-policy" \
                   -H "Content-Type: application/json" \
                   -d @/etc/ilm/ilm-policy.json
              echo "Applying Index Template..."
              curl -X PUT "http://elasticsearch:9200/_index_template/audit-logs-template" \
                   -H "Content-Type: application/json" \
                   -d @/etc/ilm/index-template.json
              echo "ILM Policy & Template configuration complete."
          volumeMounts:
            - name: ilm-config
              mountPath: /etc/ilm
      volumes:
        - name: ilm-config
          configMap:
            name: elasticsearch-ilm-policy
