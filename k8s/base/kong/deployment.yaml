apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: infra
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: procurement-portal
spec:
  type: LoadBalancer
  ports:
    - name: kong-proxy
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: kong-proxy-tls
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: kong-admin
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app.kubernetes.io/name: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: infra
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: procurement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
        app.kubernetes.io/part-of: procurement-portal
    spec:
      containers:
        - name: proxy
          image: kong:3.7
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000, 0.0.0.0:8443 ssl
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: proxy-ssl
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 8001
              protocol: TCP
            - name: status
              containerPort: 8100
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: kong
spec:
  controller: ingress-controllers.konghq.com/kong
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: procurement-ingress
  namespace: procurement
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/strip-path: "false"
    konghq.com/override: kong-ingress-rules
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - apps.procurement.com
        - supplier.procurement.com
        - admin.procurement.com
        - api.procurement.com
      secretName: procurement-tls
  rules:
    - host: apps.procurement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buyer-portal
                port:
                  number: 3000
    - host: supplier.procurement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supplier-portal
                port:
                  number: 3001
    - host: admin.procurement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-portal
                port:
                  number: 3002
    - host: api.procurement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: procurement-api
                port:
                  number: 8000
